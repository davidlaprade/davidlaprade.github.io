# Site settings
title: David Laprade | Blog
description: "Yet another blog by a software developer."
url: "https://laprade.blog"
# Keep Atom identifiers stable when the public domain changes.
feed_id: "http://davidlaprade.github.io"
author:
  name: "David Laprade"
  email: "david.laprade@gmail.com"
  url: "https://laprade.blog"

# Build settings
baseurl: ""
markdown: kramdown
source: .
destination: ./_site
permalink: /:title
paginate: 8
paginate_path: /page:num/
excerpt_separator: <!--excerpt_end-->

# Default values
defaults:
  -
    scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
      comments: true

# Custom variables
version: "1.1.0"

plugins:
  - jekyll-redirect-from
  - jekyll-paginate

# Options
custom_header: false
custom_nav_footer: false
reverse: false
